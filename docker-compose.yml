services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shoppinglist-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-shoppinglist}
      DB_USER: ${MYSQL_USER:-shoppinglist}
      DB_PASSWORD: ${MYSQL_PASSWORD:-shoppinglist}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - shoppinglist-network

  db:
    image: mysql:8.0
    container_name: shoppinglist-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-shoppinglist}
      MYSQL_USER: ${MYSQL_USER:-shoppinglist}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-shoppinglist}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysql -h localhost -u root -p\"$${MYSQL_ROOT_PASSWORD}\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    restart: unless-stopped
    networks:
      - shoppinglist-network

volumes:
  mysql_data:

networks:
  shoppinglist-network:
    driver: bridge